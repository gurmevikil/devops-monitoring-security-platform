global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus also scrapes itself so its own health and workload are visible.
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: flask-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
